name: Dashboard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v5
        
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pricing-dashboard/package-lock.json

      - name: Run typecheck and tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
          npm run test:browser

      - name: Build Docker image
        run: docker build -t pricing-dashboard:ci .
    
