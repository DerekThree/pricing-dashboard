name: Dashboard CD

on:
  workflow_run:
    workflows:
      - Dashboard CI
    types:
      - completed

permissions:
  actions: read
  id-token: write

concurrency:
  group: dashboard-cd
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::064550674390:role/pricing-backend-github-deploy
          aws-region: us-east-1

      - name: Discover current static hosting
        id: hosting
        run: |
          hosting=$(aws cloudfront list-distributions --output text --query \
            "DistributionList.Items[?Origins.Items[?Id=='dashboard-s3']].\
          [Id,DomainName,Origins.Items[?Id=='dashboard-s3'].DomainName | [0]]")
          if [[ -z "$hosting" || "$hosting" == *$'\n'* ]]; then
            echo '::error::Expected exactly one distribution with the dashboard-s3 origin.'
            exit 1
          fi
          read -r distribution_id domain origin <<< "$hosting"
          bucket=${origin%%.s3.*}
          if [[ -z "$distribution_id" || "$domain" != *.cloudfront.net ||
                "$origin" != "${bucket}.s3.${AWS_REGION}.amazonaws.com" ]]; then
            echo '::error::Dashboard distribution has an unexpected S3 origin.'
            exit 1
          fi
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "url=https://$domain" >> "$GITHUB_OUTPUT"

      - name: Download CI browser assets
        uses: actions/download-artifact@v7
        with:
          name: dashboard-static
          path: build/client
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish browser assets and runtime configuration
        env:
          BUCKET: ${{ steps.hosting.outputs.bucket }}
        run: |
          test -s build/client/index.html
          test -d build/client/assets
          printf '%s\n' \
            'window.__APP_CONFIG__ = {"BACKEND_API_URL":"","ACCOUNT_PROCESSOR_API_URL":""};' \
            > build/client/config.js

          aws s3 sync build/client "s3://$BUCKET" \
            --exclude 'assets/*' --exclude '*.gz' \
            --exclude index.html --exclude config.js \
            --cache-control 'public,max-age=300' --only-show-errors
          aws s3 sync build/client/assets "s3://$BUCKET/assets" \
            --exclude '*.gz' \
            --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          aws s3 cp build/client/config.js "s3://$BUCKET/config.js" \
            --content-type application/javascript \
            --cache-control 'no-cache,max-age=0,must-revalidate' --only-show-errors
          aws s3 cp build/client/index.html "s3://$BUCKET/index.html" \
            --content-type text/html \
            --cache-control 'no-cache,max-age=0,must-revalidate' --only-show-errors

      - name: Invalidate CloudFront and wait for completion
        env:
          DISTRIBUTION_ID: ${{ steps.hosting.outputs.distribution_id }}
        run: |
          invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths '/*' \
            --query 'Invalidation.Id' --output text)
          test -n "$invalidation"
          test "$invalidation" != None
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$invalidation"

      - name: Verify deployed release through CloudFront
        env:
          DASHBOARD_URL: ${{ steps.hosting.outputs.url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          while IFS= read -r -d '' file; do
            path=${file#build/client/}
            curl --fail --silent --show-error --compressed \
              --connect-timeout 10 --max-time 60 \
              "$DASHBOARD_URL/$path" -o "$RUNNER_TEMP/deployed-asset"
            if ! cmp -s "$file" "$RUNNER_TEMP/deployed-asset"; then
              echo "::error::CloudFront content differs from CI release: $path"
              exit 1
            fi
          done < <(find build/client -type f ! -name '*.gz' -print0)
          echo "Verified Dashboard release $COMMIT_SHA at $DASHBOARD_URL"
